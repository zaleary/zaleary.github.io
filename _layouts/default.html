<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title and page.title != "Home" %}
        {{ page.title }} - {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v=7" />
  </head>
  <body>
    <main class="page">
      <section class="content">
        <div class="content-inner">
          <header class="hero">
            <h1><a class="post-link" href="{{ '/' | relative_url }}">Zack O'Leary</a></h1>
            <p class="credentials">Medicine, Misadventures, Master Plans.</p>
            <p class="bio">Diagnosing humans, redesigning workflows, and over-complicating simple routines for fun.</p>
          </header>
          {{ content }}
        </div>
      </section>

      <footer class="site-footer">
        <a class="link" href="/goodlibby/">GoodLibby</a>
        <span class="sep" aria-hidden="true">·</span>
        <a class="link" href="/takeout-hydrator/">Takeout Hydrator</a>
        <span class="sep" aria-hidden="true">·</span>
        <a class="link" href="mailto:me@zaleary.tv">Email Me</a>
        <span class="sep" aria-hidden="true">·</span>
        <a class="link" href="https://www.linkedin.com/in/zaleary/" target="_blank" rel="noreferrer">LinkedIn</a>
      </footer>
    </main>
  </body>
</html>
